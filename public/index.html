<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>Masood AI</title>
</head>
<body>
<div class="app">
  <header><div><h1>Masood AI</h1><p>Dr. Masood's personal assistant</p></div><span id="status" class="dot">●</span></header>
  <main id="chat"><div class="bubble assistant">Hello! I am Dr. Masood's AI assistant. How can I help you?</div></main>
  <div class="quick"><button onclick="ask('What is the course code for Functional English?')">Functional English</button><button onclick="ask('What is the course code for Introduction to Artificial Intelligence?')">AI course</button><button onclick="ask('Show my saved memory')">Memory</button></div>
  <form id="form"><input id="input" autocomplete="off" placeholder="Type your message..."><button>Send</button></form>
</div>
<script src="/app.js"></script>
</body>
</html>
